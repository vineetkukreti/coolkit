# Portal Scanner Configuration — Healthcare AI Companies
# Focused on healthcare, biotech, pharma, and life sciences companies
# leveraging AI/ML for drug discovery, clinical diagnostics, and patient care.
#
# Strategy (3 levels):
#   1. Playwright -> careers_url of each company (real-time, reliable)
#   2. Greenhouse API -> structured JSON (fast, Greenhouse-only)
#   3. WebSearch with site: filters (broad discovery, may be stale)
#
# IMPORTANT: Each company in tracked_companies MUST have careers_url.

# -- Title filter --
# The scanner uses these keywords to decide if a title is relevant.
# At least 1 positive must match AND 0 negatives must match (case-insensitive).

title_filter:
  positive:
    # -- Healthcare AI specific --
    - "clinical AI"
    - "healthcare AI"
    - "medical AI"
    # -- Core ML/AI roles --
    - "ML engineer"
    - "AI engineer"
    - "GenAI"
    - "LLM"
    - "NLP"
    - "computer vision"
    - "data scientist"
    - "MLOps"
    - "agentic AI"
    - "deep learning"
    # -- Broader AI/ML keywords --
    - "machine learning"
    - "AI"
    - "ML"
    - "applied scientist"
    - "research scientist"
    - "bioinformatics"
    - "computational biology"
  negative:
    # -- Too senior for 2yr experience --
    - "Senior"
    - "Staff"
    - "Principal"
    - "Lead"
    - "Head of"
    - "Director"
    - "VP"
    - "Chief"
    - "Architect"    # usually 5+ yr roles
    - "Manager"      # people-management roles
    # -- Irrelevant stacks --
    - "Intern"
    - ".NET"
    - "Java "
    - "iOS"
    - "Android"
    - "PHP"
    - "Ruby"
    - "Embedded"
    - "Blockchain"
    - "Web3"
    - "Salesforce Admin"
    - "SAP"
    - "COBOL"
    - "Nursing"
    - "RN"
    - "Medical Assistant"
  seniority_boost:
    # Roles that match 0-3yr experience level
    - "Junior"
    - "Associate"
    - "Entry"

# -- Search queries --
# Each query triggers a WebSearch. Use site: to filter by portal.

search_queries:

  # -- Greenhouse healthcare AI --
  - name: Greenhouse — Healthcare AI Engineer
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "AI Engineer" OR "ML Engineer" OR "Machine Learning" healthcare OR clinical OR medical'
    enabled: true

  - name: Greenhouse — Clinical Data Scientist
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "Data Scientist" OR "Applied Scientist" healthcare OR biotech OR pharma OR clinical'
    enabled: true

  - name: Greenhouse — NLP Healthcare
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "NLP" OR "Natural Language Processing" OR "LLM" medical OR clinical OR health'
    enabled: true

  - name: Greenhouse — Computer Vision Medical
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "Computer Vision" OR "Deep Learning" medical OR pathology OR radiology OR imaging'
    enabled: true

  - name: Greenhouse — MLOps Healthcare
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "MLOps" OR "ML Infrastructure" OR "ML Platform" healthcare OR biotech OR pharma'
    enabled: true

  - name: Greenhouse — Drug Discovery AI
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "drug discovery" OR "computational biology" OR "bioinformatics" AI OR ML OR "machine learning"'
    enabled: true

  # -- Ashby healthcare AI --
  - name: Ashby — Healthcare AI Engineer
    query: 'site:jobs.ashbyhq.com "AI Engineer" OR "ML Engineer" OR "Machine Learning" healthcare OR clinical OR medical'
    enabled: true

  - name: Ashby — GenAI Healthcare
    query: 'site:jobs.ashbyhq.com "GenAI" OR "LLM" OR "Generative AI" health OR medical OR clinical'
    enabled: true

  - name: Ashby — Agentic AI Healthcare
    query: 'site:jobs.ashbyhq.com "Agentic" OR "AI Agent" healthcare OR clinical OR medical'
    enabled: true

  # -- Lever healthcare AI --
  - name: Lever — Healthcare AI Roles
    query: 'site:jobs.lever.co "AI Engineer" OR "ML Engineer" OR "Data Scientist" healthcare OR biotech OR pharma OR clinical'
    enabled: true

  - name: Lever — Deep Learning Life Sciences
    query: 'site:jobs.lever.co "Deep Learning" OR "Computer Vision" OR "NLP" drug OR genomics OR biotech OR medical'
    enabled: true

  # -- Cross-portal broad searches --
  - name: All Portals — Healthcare GenAI
    query: '"GenAI" OR "Generative AI" OR "LLM Engineer" healthcare OR clinical OR "life sciences" remote'
    enabled: true

  - name: All Portals — Computational Biology AI
    query: '"computational biology" OR "computational chemistry" "AI" OR "ML" OR "deep learning" remote'
    enabled: true

